<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060B16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MS TV" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      (function () {
        function isBrowserExtensionError(msg, stack, filename) {
          var combined = String(msg || '') + ' ' + String(stack || '') + ' ' + String(filename || '');
          return (
            /chrome-extension:\/\/|moz-extension:\/\/|safari-(?:web-)?extension:\/\/|ms-browser-extension:\/\//i.test(
              combined
            ) || /Window message "chrome: call method" timed out/i.test(combined)
          );
        }
        window.addEventListener(
          'error',
          function (e) {
            var err = e && e.error;
            if (isBrowserExtensionError(e && e.message, err && err.stack, e && e.filename)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var r = e && e.reason;
            var msg = r && typeof r === 'object' ? r.message : r;
            var stack = r && typeof r === 'object' ? r.stack : '';
            if (isBrowserExtensionError(msg, stack, '')) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
    <title>MS TV</title>
    <meta
      name="description"
      content="منصة MS TV لبث القنوات التلفزيونية المباشرة والأفلام والمسلسلات مع مشغل سريع ودعم روابط M3U و Xtream والقوائم الخاصة."
    />
    <meta property="og:title" content="MS TV" />
    <meta
      name="og:description"
      property="og:description"
      content="منصة MS TV لبث القنوات التلفزيونية المباشرة والأفلام والمسلسلات مع مشغل سريع ودعم روابط M3U و Xtream والقوائم الخاصة."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/ms-tv-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/assets/ms-tv-icon.png" />
    <link rel="apple-touch-icon" href="/assets/ms-tv-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#060B16] text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
